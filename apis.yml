name: Puzzlium
description: Puzzlium is a mobile puzzle platform and social network built around the tagline "Play.
  Create. Compete." Founded in 2014 by veteran puzzle designers Serhiy Grabarchuk, Serhiy Grabarchuk Jr.,
  Peter Grabarchuk, and Mehmet Murat Sevim, the iOS and Amazon Kindle app lets a community of hundreds
  of thousands of solvers and creators play, generate, publish, and compete with interactive puzzles.
  Based in San Jose, California and backed by 500 Startups (500 Global), Puzzlium is a consumer
  application that does not publish a public developer API, SDK, or documentation surface.
